    function renderAll(){closeTreeMenu();closeMarkdownSelectionToolbar();renderTree();renderContent();updateStatus()}
    document.querySelectorAll(".mode").forEach(btn=>btn.onclick=()=>{currentMode=btn.dataset.mode;renderContent()});
    document.getElementById("openFolderBtn").onclick=()=>alert("原型中模拟：打开任意本地文件夹后，左侧直接显示真实目录树。");
    document.getElementById("revealBtn").onclick=()=>alert("原型中模拟：在 Finder 中定位当前文件。");
    const projectMenu=document.getElementById("projectMenu"),projectMenuBtn=document.getElementById("projectMenuBtn");
    function closeProjectMenu(){projectMenu.classList.remove("open");projectMenuBtn.setAttribute("aria-expanded","false")}
    document.getElementById("rootCreateBtn").onclick=event=>{const rect=event.currentTarget.getBoundingClientRect();openTreeMenu(null,files,event.currentTarget,0,rect.right-176,rect.bottom+4,false)};
    bindPrototypeDropTarget(document.getElementById("workspaceDropTarget"),null,files);
    projectMenuBtn.onclick=()=>{closeTreeMenu();const open=!projectMenu.classList.contains("open");projectMenu.classList.toggle("open",open);projectMenuBtn.setAttribute("aria-expanded",String(open))};
    document.getElementById("newWindowBtn").onclick=()=>{closeProjectMenu();window.open(location.href,"_blank","noopener")};
    document.getElementById("reloadTreeBtn").onclick=()=>{closeProjectMenu();renderTree()};
    document.getElementById("mdPrintButton").onclick=printCurrentMarkdown;
    document.getElementById("mdTableButton").onclick=()=>{const textarea=document.querySelector(".editor-wrap textarea");if(!textarea){currentFile.content+=(currentFile.content.endsWith("\n")?"\n":"\n\n")+"| 列 1 | 列 2 | 列 3 |\n| --- | --- | --- |\n|  |  |  |\n|  |  |  |";scheduleAutosave();renderContent();return}activeTextarea=textarea;menuSelection={start:textarea.selectionStart,end:textarea.selectionEnd};applyPrototypeCommand("table");if(currentMode==="edit")renderContent()};
    document.getElementById("mdSelectionToolbar").querySelectorAll("button").forEach(button=>{button.onpointerdown=event=>event.preventDefault();button.onclick=()=>applyPrototypeCommand(button.dataset.command)});
    document.getElementById("treeActionMenu").querySelectorAll("button").forEach(button=>button.onclick=()=>button.dataset.treeAction==="trash"?trashTreeTarget():button.dataset.treeAction==="rename"?beginPrototypeRename():beginTreeCreate(button.dataset.treeAction));
    window.addEventListener("pointerdown",event=>{if(!event.target.closest?.(".project-actions"))closeProjectMenu();if(!event.target.closest?.("#treeActionMenu")&&!event.target.closest?.(".tree-row-actions")&&!event.target.closest?.("#rootCreateBtn"))closeTreeMenu();if(!event.target.closest?.("#mdSelectionToolbar")&&!event.target.closest?.("textarea"))closeMarkdownSelectionToolbar()});
    window.addEventListener("keydown",event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==="p"){event.preventDefault();printCurrentMarkdown()}},true);
    window.addEventListener("keydown",event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==="n"){event.preventDefault();window.open(location.href,"_blank","noopener")}if(event.key==="Escape"){closeProjectMenu();closeTreeMenu(true);closeMarkdownSelectionToolbar();clearPrototypeDrag();cancelPrototypeRename()}});
    window.addEventListener("afterprint",()=>{document.getElementById("markdownPrintSurface").innerHTML="";printBusy=false});
    window.addEventListener("blur",clearPrototypeDrag);
    window.addEventListener("scroll",()=>{closeTreeMenu();closeMarkdownSelectionToolbar()},true);
    renderAll();
  </script>
</body>
</html>
