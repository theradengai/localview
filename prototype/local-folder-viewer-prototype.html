    textarea{width:100%;height:100%;resize:none;border:0;outline:0;padding:28px 34px 100px;line-height:1.65;font-family:"SFMono-Regular",Consolas,monospace;font-size:14px;background:#fff;color:#222;white-space:pre-wrap;overflow-wrap:anywhere}.editor-wrap.live textarea{max-width:820px;display:block;margin:0 auto;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;font-size:16px;line-height:1.72}.live-label{position:absolute;top:8px;right:12px;z-index:2;color:#999;font-size:10px;pointer-events:none}

    .md-context-menu{position:fixed;z-index:20;width:226px;display:none;grid-template-columns:1fr 1fr;gap:2px;padding:5px;border:1px solid var(--line);border-radius:9px;background:#fff;box-shadow:0 12px 34px rgba(0,0,0,.16)}.md-context-menu.open{display:grid}.md-context-menu button{border:0;border-radius:6px;padding:7px 8px;background:transparent;color:#222;text-align:left;cursor:pointer;font-size:12px}.md-context-menu button:hover{background:var(--soft)}.md-context-hint{grid-column:1/-1;margin-top:3px;padding:6px 4px 2px;border-top:1px solid #ecece7;color:#999;text-align:center;font-size:10px}

    @media (max-width:800px){.workspace{grid-template-columns:210px 1fr}.titlebar{grid-template-columns:120px 1fr 160px}.preview{padding:32px 28px 100px}}

  <script>
    const files=[
      {name:"README.md",type:"md",path:"/Users/thera/project/README.md",content:`# Local Folder Viewer

这是一个**不建库、不索引**的本地文件工作台。

        {name:"roadmap.md",type:"md",path:"/Users/thera/project/docs/roadmap.md",content:`# Roadmap

      {name:"prototype",type:"folder",path:"/Users/thera/project/prototype",open:true,children:[
        {name:"index.html",type:"html",path:"/Users/thera/project/prototype/index.html",content:`<!doctype html>
<html><head><meta charset="utf-8"><style>body{font-family:system-ui;margin:0;background:#f4f0e8;color:#1e1e1e}main{max-width:760px;margin:80px auto;padding:0 32px}.tag{display:inline-block;border:1px solid #222;border-radius:999px;padding:6px 10px;font-size:12px}h1{font-size:64px;line-height:1;margin:28px 0 20px}p{font-size:20px;line-height:1.6;color:#555}button{margin-top:24px;border:0;background:#111;color:white;padding:14px 20px;border-radius:10px;font-size:16px}</style></head><body><main><span class="tag">LOCAL-FIRST</span><h1>Open a file.<br>See the whole context.</h1><p>A lightweight browser for Markdown and HTML folders.</p><button onclick="this.textContent='It works'">Try interaction</button></main></body></html>`},
        {name:"style.css",type:"text",path:"/Users/thera/project/prototype/style.css",content:`body {\n  font-family: system-ui;\n  background: #f4f0e8;\n}`}

    let currentFile=files[0],currentMode="preview",dirty=false,saveTimer=null,activeTextarea=null,menuSelection={start:0,end:0},treeMenuTarget=null,createDraft=null;
    function saveNow(){if(saveTimer)clearTimeout(saveTimer);saveTimer=null;dirty=false;updateStatus()}
    function scheduleAutosave(){dirty=true;if(saveTimer)clearTimeout(saveTimer);updateStatus();saveTimer=setTimeout(saveNow,600)}
    function fileIcon(type,open=false){return type==="folder"?(open?"▾":"▸"):""}
    function renderTree(){const tree=document.getElementById("tree");tree.innerHTML="";if(createDraft&&!createDraft.parentItem)renderCreateEditor(createDraft,tree);files.forEach(item=>renderNode(item,0,tree,files))}
    function renderCreateEditor(draft,parent){const editor=document.createElement("div");editor.className="tree-create-editor"+(draft.depth?" indent-"+draft.depth:"");const input=document.createElement("input");input.placeholder=draft.kind==="folder"?"新建文件夹":"untitled.md";input.setAttribute("aria-label",draft.kind==="folder"?"新建文件夹名称":"新建 Markdown 文件名");input.onkeydown=event=>{if(event.isComposing)return;if(event.key==="Escape"){createDraft=null;renderTree()}if(event.key==="Enter"){event.preventDefault();commitTreeCreate(input.value)}};editor.appendChild(input);parent.appendChild(editor);setTimeout(()=>input.focus())}
    function renderNode(item,depth,parent,collection){const row=document.createElement("div");row.className="tree-row "+(item.type==="folder"?"folder ":"")+(currentFile===item?"active ":"")+(depth?"indent-"+depth:"");const main=document.createElement("div");main.className="tree-row-main";const icon=fileIcon(item.type,item.open);main.innerHTML=`${icon?`<span class="icon">${icon}</span>`:""}<span>${item.name}</span>`;main.tabIndex=0;main.onclick=()=>{if(item.type==="folder"){item.open=!item.open;renderTree()}else{saveNow();currentFile=item;currentMode=["md","html","text"].includes(item.type)?"preview":"edit";renderAll()}};main.oncontextmenu=event=>{event.preventDefault();openTreeMenu(item,collection,row,item.type==="folder"?depth+1:depth,event.clientX,event.clientY,true)};row.appendChild(main);if(item.type==="folder"){const actions=document.createElement("div");actions.className="tree-row-actions";const add=document.createElement("button");add.textContent="+";add.setAttribute("aria-label",`在 ${item.name} 中新建`);add.onclick=event=>{event.stopPropagation();openTreeMenu(item,collection,row,depth+1,event.clientX,event.clientY,false)};const more=document.createElement("button");more.textContent="•••";more.setAttribute("aria-label",`${item.name} 文件夹操作`);more.onclick=event=>{event.stopPropagation();openTreeMenu(item,collection,row,depth+1,event.clientX,event.clientY,true)};actions.append(add,more);row.appendChild(actions)}parent.appendChild(row);if(item.type==="folder"&&item.open){if(createDraft?.parentItem===item)renderCreateEditor(createDraft,parent);item.children.forEach(child=>renderNode(child,depth+1,parent,item.children))}}
    function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
    function prototypeTables(html){return html.replace(/^\|(.+)\|\n\|([ :|-]+)\|\n((?:\|.*\|\n?)*)/gm,(_,header,_delimiter,body)=>{const cells=line=>line.replace(/^\||\|$/g,"").split("|").map(cell=>cell.trim());const head=cells(header).map(cell=>`<th>${cell}</th>`).join("");const rows=body.trim().split("\n").filter(Boolean).map(line=>`<tr>${cells(line).map(cell=>`<td>${cell}</td>`).join("")}</tr>`).join("");return`<table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`})}
    function mdToHtml(md){let html=prototypeTables(escapeHtml(md));html=html.replace(/^### (.*)$/gm,"<h3>$1</h3>").replace(/^## (.*)$/gm,"<h2>$1</h2>").replace(/^# (.*)$/gm,"<h1>$1</h1>").replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/^> (.*)$/gm,"<blockquote>$1</blockquote>").replace(/^- (.*)$/gm,"<li>$1</li>").replace(/^\d+\. (.*)$/gm,"<li>$1</li>").replace(/\n{2,}/g,"</p><p>").replace(/\n/g,"<br>");html=html.replace(/(<li>.*?<\/li>)+/gs,m=>`<ul>${m}</ul>`);return`<div class="preview"><p>${html}</p></div>`}
    function renderContent(){const content=document.getElementById("content"),tabs=document.getElementById("modeTabs");tabs.style.display=["md","html","text"].includes(currentFile.type)?"flex":"none";document.querySelectorAll(".mode").forEach(b=>b.classList.toggle("active",b.dataset.mode===currentMode));content.className="content"+(currentMode==="split"?" split":"");content.innerHTML="";
      if(currentFile.type==="md"){if(currentMode==="edit"||currentMode==="split"){const w=document.createElement("div");w.className="editor-wrap"+(currentMode==="edit"?" live":"");const ta=document.createElement("textarea");ta.wrap="soft";ta.value=currentFile.content;ta.oninput=e=>{closeMarkdownSelectionToolbar();currentFile.content=e.target.value;scheduleAutosave();if(currentMode==="split"){const pv=document.querySelector(".preview-wrap");if(pv)pv.innerHTML=mdToHtml(currentFile.content)}};ta.onkeydown=e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="s"){e.preventDefault();saveNow()}};ta.onkeyup=e=>{if(e.shiftKey||["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Home","End"].includes(e.key))openMarkdownSelectionToolbar(ta)};ta.onpointerup=()=>openMarkdownSelectionToolbar(ta);ta.oncontextmenu=e=>{closeMarkdownSelectionToolbar();if(e.shiftKey)return;e.preventDefault();activeTextarea=ta;menuSelection={start:ta.selectionStart,end:ta.selectionEnd};openMarkdownMenu(e.clientX,e.clientY)};w.appendChild(ta);if(currentMode==="edit"){const label=document.createElement("div");label.className="live-label";label.textContent="Live Preview · Markdown 源码";w.appendChild(label);const h=document.createElement("div");h.className="hint";h.textContent="自动保存 · ⌘S 立即保存";w.appendChild(h)}content.appendChild(w)}if(currentMode==="preview"||currentMode==="split"){const p=document.createElement("div");p.className="preview-wrap";p.innerHTML=mdToHtml(currentFile.content);content.prepend(p)}}
      else if(currentFile.type==="html"){if(currentMode==="edit"||currentMode==="split"){const w=document.createElement("div");w.className="editor-wrap";const ta=document.createElement("textarea");ta.value=currentFile.content;ta.oninput=e=>{currentFile.content=e.target.value;scheduleAutosave();if(currentMode==="split"){const f=document.querySelector("iframe");if(f)f.srcdoc=currentFile.content}};w.appendChild(ta);content.appendChild(w)}if(currentMode==="preview"||currentMode==="split"){const w=document.createElement("div");w.className="html-wrap";const f=document.createElement("iframe");f.setAttribute("sandbox","allow-scripts");f.srcdoc=currentFile.content;w.appendChild(f);content.prepend(w)}}
      else if(currentFile.type==="text"){const w=document.createElement("div");w.className="editor-wrap";const ta=document.createElement("textarea");ta.value=currentFile.content||"";ta.oninput=e=>{currentFile.content=e.target.value;scheduleAutosave()};w.appendChild(ta);content.appendChild(w)}else content.innerHTML=`<div class="empty">该文件类型将在后续版本中支持预览。<br><br>${currentFile.name}</div>`}
    function updateStatus(){document.getElementById("windowTitle").textContent=`project / ${currentFile.name}`;document.getElementById("fileName").textContent=currentFile.name;document.getElementById("fileMeta").textContent=currentFile.type==="md"?"Markdown":currentFile.type==="html"?"HTML":currentFile.type==="image"?"Image":"Text";document.getElementById("pathText").textContent=currentFile.path||"";const state=document.getElementById("saveState");state.textContent=dirty?"未保存":"已保存";state.className=dirty?"dirty":"";document.getElementById("lineCount").textContent=`${(currentFile.content||"").split("\n").length} 行`}
    function openTreeMenu(item,collection,trigger,depth,x,y,full){closeProjectMenu();closeMarkdownMenu();closeMarkdownSelectionToolbar();const menu=document.getElementById("treeActionMenu"),canCreate=!item||item.type==="folder";treeMenuTarget={item,collection,trigger,depth};menu.querySelectorAll('[data-tree-action="markdown"],[data-tree-action="folder"]').forEach(node=>node.hidden=!canCreate);menu.querySelectorAll("[data-tree-delete-only]").forEach(node=>node.hidden=!(full&&item));menu.classList.add("open");menu.style.left=Math.max(8,Math.min(x,innerWidth-184))+"px";menu.style.top=Math.max(8,Math.min(y,innerHeight-(full&&item?126:86)))+"px";menu.querySelector("button:not([hidden])")?.focus()}
    function closeTreeMenu(restore=false){const target=treeMenuTarget;document.getElementById("treeActionMenu").classList.remove("open");treeMenuTarget=null;if(restore)setTimeout(()=>target?.trigger?.focus?.())}
    function beginTreeCreate(kind){const target=treeMenuTarget;if(!target)return;const parentItem=target.item?.type==="folder"?target.item:null;if(parentItem)parentItem.open=true;createDraft={kind,parentItem,items:parentItem?parentItem.children:files,depth:target.depth};closeTreeMenu();renderTree()}
    function commitTreeCreate(rawName){if(!createDraft)return;let name=rawName.trim();if(!name||name==="."||name===".."||/[\\/]/.test(name)){alert("请输入有效名称");return}if(createDraft.kind==="markdown"&&!name.toLowerCase().endsWith(".md"))name+=".md";const lower=name.toLowerCase();if(createDraft.kind==="folder"&&(lower===".ds_store"||lower.includes(".localview-")&&lower.endsWith(".tmp")||[".numbers",".pages",".key"].some(suffix=>lower.endsWith(suffix)))){alert("该文件夹名称已保留");return}if(createDraft.items.some(item=>item.name.toLowerCase()===lower)){alert("同名项已存在");return}const parentPath=createDraft.parentItem?.path||"/Users/thera/project";const item=createDraft.kind==="folder"?{name,type:"folder",path:`${parentPath}/${name}`,open:false,children:[]}:{name,type:"md",path:`${parentPath}/${name}`,content:""};createDraft.items.push(item);createDraft.items.sort((a,b)=>Number(b.type==="folder")-Number(a.type==="folder")||a.name.localeCompare(b.name));createDraft=null;if(item.type==="md"){saveNow();currentFile=item;currentMode="edit";renderAll()}else renderTree()}
    function containsPrototypeItem(parent,target){return parent===target||parent.type==="folder"&&parent.children.some(child=>containsPrototypeItem(child,target))}
    function trashTreeTarget(){const target=treeMenuTarget;if(!target?.item)return;const item=target.item;const message=item.type==="folder"?`“${item.name}”及其中的内容会一起移到 macOS 废纸篓。`:`“${item.name}”会移到 macOS 废纸篓。`;if(!confirm(message))return;const index=target.collection.indexOf(item);if(index>=0)target.collection.splice(index,1);if(containsPrototypeItem(item,currentFile))currentFile=files[0];closeTreeMenu();renderAll()}
    function openMarkdownMenu(x,y){const menu=document.getElementById("mdContextMenu");menu.classList.add("open");menu.style.left=Math.max(8,Math.min(x,innerWidth-234))+"px";menu.style.top=Math.max(8,Math.min(y,innerHeight-142))+"px";menu.querySelector("button").focus()}
    function closeMarkdownMenu(){document.getElementById("mdContextMenu").classList.remove("open")}
    function openMarkdownSelectionToolbar(textarea){const start=textarea.selectionStart,end=textarea.selectionEnd;if(start===end){closeMarkdownSelectionToolbar();return}activeTextarea=textarea;menuSelection={start,end};closeMarkdownMenu();const bar=document.getElementById("mdSelectionToolbar"),rect=textarea.getBoundingClientRect();bar.classList.add("open");const width=Math.min(bar.scrollWidth,rect.width-16);bar.style.maxWidth=Math.max(0,rect.width-16)+"px";bar.style.left=Math.max(rect.left+8,Math.min(rect.left+(rect.width-width)/2,rect.right-width-8))+"px";bar.style.top=Math.max(rect.top+8,Math.min(rect.top+54,rect.bottom-44))+"px"}
    function closeMarkdownSelectionToolbar(){document.getElementById("mdSelectionToolbar").classList.remove("open")}
    function applyPrototypeCommand(command){if(!activeTextarea)return;const value=activeTextarea.value,{start,end}=menuSelection,selected=value.slice(start,end);let from=start,to=end,insert=selected;
      if(command==="bold")insert=`**${selected}**`;
      if(command==="italic")insert=`*${selected}*`;
      if(command==="quote"){from=value.lastIndexOf("\n",start-1)+1;const lineEnd=value.indexOf("\n",end);to=lineEnd<0?value.length:lineEnd;insert=value.slice(from,to).split("\n").map(line=>line.trim()?`> ${line.replace(/^>\s?/,"")}`:line).join("\n")}
      if(command==="code")insert=`\`${selected}\``;
      if(command==="link")insert=`[${selected}](https://example.com)`;
      if(command==="heading"){from=value.lastIndexOf("\n",start-1)+1;const lineEnd=value.indexOf("\n",end);to=lineEnd<0?value.length:lineEnd;insert="# "+value.slice(from,to).replace(/^#{1,6}\s+/,"")}
      if(command==="list"){from=value.lastIndexOf("\n",start-1)+1;const lineEnd=value.indexOf("\n",end);to=lineEnd<0?value.length:lineEnd;insert=value.slice(from,to).split("\n").map(line=>line.trim()?`- ${line.replace(/^[-*+]\s+/,"")}`:line).join("\n")}
      if(command==="table")insert="| 列 1 | 列 2 | 列 3 |\n| --- | --- | --- |\n|  |  |  |\n|  |  |  |";
      activeTextarea.value=value.slice(0,from)+insert+value.slice(to);activeTextarea.selectionStart=from;activeTextarea.selectionEnd=from+insert.length;currentFile.content=activeTextarea.value;scheduleAutosave();const pv=document.querySelector(".preview-wrap");if(pv)pv.innerHTML=mdToHtml(currentFile.content);activeTextarea.focus();closeMarkdownMenu();closeMarkdownSelectionToolbar()}
    function renderAll(){closeTreeMenu();closeMarkdownMenu();closeMarkdownSelectionToolbar();renderTree();renderContent();updateStatus()}
    document.querySelectorAll(".mode").forEach(btn=>btn.onclick=()=>{currentMode=btn.dataset.mode;renderContent()});
    document.getElementById("openFolderBtn").onclick=()=>alert("原型中模拟：打开任意本地文件夹后，左侧直接显示真实目录树。");
    document.getElementById("revealBtn").onclick=()=>alert("原型中模拟：在 Finder 中定位当前文件。");
    const projectMenu=document.getElementById("projectMenu"),projectMenuBtn=document.getElementById("projectMenuBtn");
    function closeProjectMenu(){projectMenu.classList.remove("open");projectMenuBtn.setAttribute("aria-expanded","false")}
    document.getElementById("rootCreateBtn").onclick=event=>{const rect=event.currentTarget.getBoundingClientRect();openTreeMenu(null,files,event.currentTarget,0,rect.right-176,rect.bottom+4,false)};
    projectMenuBtn.onclick=()=>{closeTreeMenu();const open=!projectMenu.classList.contains("open");projectMenu.classList.toggle("open",open);projectMenuBtn.setAttribute("aria-expanded",String(open))};
    document.getElementById("newWindowBtn").onclick=()=>{closeProjectMenu();window.open(location.href,"_blank","noopener")};
    document.getElementById("reloadTreeBtn").onclick=()=>{closeProjectMenu();renderTree()};
    document.getElementById("mdContextMenu").querySelectorAll("button").forEach(button=>button.onclick=()=>applyPrototypeCommand(button.dataset.command));
    document.getElementById("mdSelectionToolbar").querySelectorAll("button").forEach(button=>{button.onpointerdown=event=>event.preventDefault();button.onclick=()=>applyPrototypeCommand(button.dataset.command)});
    document.getElementById("treeActionMenu").querySelectorAll("button").forEach(button=>button.onclick=()=>button.dataset.treeAction==="trash"?trashTreeTarget():beginTreeCreate(button.dataset.treeAction));
    window.addEventListener("pointerdown",event=>{if(!event.target.closest?.(".project-actions"))closeProjectMenu();if(!event.target.closest?.("#treeActionMenu")&&!event.target.closest?.(".tree-row-actions")&&!event.target.closest?.("#rootCreateBtn"))closeTreeMenu();if(!event.target.closest?.("#mdContextMenu")&&!event.target.closest?.("textarea"))closeMarkdownMenu();if(!event.target.closest?.("#mdSelectionToolbar")&&!event.target.closest?.("textarea"))closeMarkdownSelectionToolbar()});
    window.addEventListener("keydown",event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==="n"){event.preventDefault();window.open(location.href,"_blank","noopener")}if(event.key==="Escape"){closeProjectMenu();closeTreeMenu(true);closeMarkdownMenu();closeMarkdownSelectionToolbar()}});
    window.addEventListener("scroll",()=>{closeTreeMenu();closeMarkdownMenu();closeMarkdownSelectionToolbar()},true);
    renderAll();
  </script>
</body>
</html>
