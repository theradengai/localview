<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FolderView Prototype</title>
  <style>
    :root{--bg:#f3f3f0;--panel:#ffffff;--line:#d7d7d1;--text:#181818;--muted:#777;--soft:#efefe9;--accent:#111;--radius:12px}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
    button,input,textarea{font:inherit}.app{height:100vh;display:grid;grid-template-rows:46px 1fr 28px}
    .titlebar{display:grid;grid-template-columns:180px 1fr 260px;align-items:center;padding:0 12px;background:rgba(255,255,255,.88);border-bottom:1px solid var(--line);backdrop-filter:blur(18px)}
    .traffic{display:flex;gap:8px;align-items:center}.dot{width:12px;height:12px;border-radius:50%}.red{background:#ff5f57}.yellow{background:#febc2e}.green{background:#28c840}
    .title{text-align:center;font-size:13px;font-weight:600;color:#444;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.toolbar{display:flex;justify-content:flex-end;gap:8px}
    .btn{border:1px solid var(--line);background:#fff;color:#222;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px}.btn:hover{background:var(--soft)}.btn.active{background:#111;color:#fff;border-color:#111}
    .workspace{min-height:0;display:grid;grid-template-columns:250px 1fr}.sidebar{background:#f8f8f5;border-right:1px solid var(--line);display:grid;grid-template-rows:auto 1fr auto;min-width:0}
    .sidebar-head{padding:14px 12px 8px;display:flex;justify-content:space-between;align-items:center}.project-name{font-size:12px;font-weight:700;letter-spacing:.02em}.tree{overflow:auto;padding:6px 8px 16px}
    .tree-row{display:flex;align-items:center;gap:7px;min-height:30px;padding:5px 8px;border-radius:7px;cursor:pointer;font-size:13px;user-select:none}.tree-row:hover{background:#ecece6}.tree-row.active{background:#deded7;font-weight:600}.tree-row.folder{font-weight:600}.indent-1{padding-left:24px}.indent-2{padding-left:40px}.icon{width:16px;text-align:center;color:#666}
    .sidebar-foot{padding:10px 12px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}.main{min-width:0;min-height:0;display:grid;grid-template-rows:42px 1fr;background:#fff}
    .filebar{display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--line);background:#fafafa}.file-name{font-size:13px;font-weight:600}.file-meta{font-size:11px;color:var(--muted);margin-left:8px}.mode-tabs{display:flex;gap:4px}.mode{border:0;background:transparent;padding:6px 9px;border-radius:7px;font-size:12px;cursor:pointer;color:#666}.mode.active{background:#111;color:#fff}
    .content{min-height:0;display:grid;grid-template-columns:1fr}.content.split{grid-template-columns:1fr 1fr}.editor-wrap,.preview-wrap,.html-wrap{min-width:0;min-height:0;overflow:auto;position:relative}.editor-wrap{border-right:1px solid var(--line)}
    textarea{width:100%;height:100%;resize:none;border:0;outline:0;padding:28px 34px 100px;line-height:1.65;font-family:"SFMono-Regular",Consolas,monospace;font-size:14px;background:#fff;color:#222}
    .preview{max-width:820px;margin:0 auto;padding:42px 56px 120px;line-height:1.72}.preview h1{font-size:34px;line-height:1.2;margin:0 0 24px}.preview h2{font-size:22px;margin-top:36px}.preview p{color:#333}.preview code{background:#f0f0eb;padding:2px 5px;border-radius:4px;font-family:"SFMono-Regular",Consolas,monospace;font-size:.92em}.preview pre{background:#161616;color:#f4f4f4;padding:18px;border-radius:10px;overflow:auto}.preview blockquote{margin:24px 0;padding:4px 18px;border-left:3px solid #111;color:#666}.preview ul{padding-left:24px}
    iframe{width:100%;height:100%;border:0;background:white}.empty{height:100%;display:flex;align-items:center;justify-content:center;color:#888;text-align:center;padding:40px}.statusbar{display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-top:1px solid var(--line);background:#f8f8f5;color:#666;font-size:11px}.dirty{color:#9a5b00}.hint{position:absolute;right:18px;bottom:18px;background:#111;color:#fff;padding:8px 10px;border-radius:8px;font-size:11px;opacity:.92}
    @media (max-width:800px){.workspace{grid-template-columns:210px 1fr}.titlebar{grid-template-columns:120px 1fr 160px}.preview{padding:32px 28px 100px}}
  </style>
</head>
<body>
  <div class="app">
    <header class="titlebar">
      <div class="traffic"><div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div></div>
      <div class="title" id="windowTitle">project / README.md</div>
      <div class="toolbar"><button class="btn" id="openFolderBtn">打开文件夹</button><button class="btn" id="revealBtn">在 Finder 中显示</button></div>
    </header>
    <div class="workspace">
      <aside class="sidebar"><div class="sidebar-head"><div class="project-name">PROJECT</div><button class="btn" style="padding:4px 7px">•••</button></div><div class="tree" id="tree"></div><div class="sidebar-foot">真实文件夹 · 无索引 · 按需读取</div></aside>
      <main class="main"><div class="filebar"><div><span class="file-name" id="fileName">README.md</span><span class="file-meta" id="fileMeta">Markdown</span></div><div class="mode-tabs" id="modeTabs"><button class="mode" data-mode="edit">编辑</button><button class="mode active" data-mode="split">分栏</button><button class="mode" data-mode="preview">预览</button></div></div><div class="content split" id="content"></div></main>
    </div>
    <footer class="statusbar"><div id="pathText">/Users/thera/project/README.md</div><div><span id="saveState">已保存</span> · UTF-8 · <span id="lineCount">12 行</span></div></footer>
  </div>
  <script>
    const files=[
      {name:"README.md",type:"md",path:"/Users/thera/project/README.md",content:`# Local Folder Viewer

这是一个**不建库、不索引**的本地文件工作台。

## 核心体验

- 双击 \`.md\` 或 \`.html\`
- 自动打开所在项目文件夹
- 左侧显示真实目录树
- Markdown 可编辑并实时预览
- HTML 默认直接预览

> 打开的是文件，获得的是文件夹上下文。

## 下一步

后续可以继续支持 PDF、Excel、PPT 和图片预览。`},
      {name:"docs",type:"folder",open:true,children:[
        {name:"product-notes.md",type:"md",path:"/Users/thera/project/docs/product-notes.md",content:`# Product Notes

## MVP

1. Finder 双击文件
2. 自动识别项目根目录
3. 左侧目录树
4. Markdown 编辑
5. HTML 预览

## 原则

保持轻量，不建立知识库数据库。`},
        {name:"roadmap.md",type:"md",path:"/Users/thera/project/docs/roadmap.md",content:`# Roadmap

- V0.1 Markdown / HTML
- V0.2 PDF
- V0.3 Excel
- V0.4 PPT
- V0.5 AI on selected files`}
      ]},
      {name:"prototype",type:"folder",open:true,children:[
        {name:"index.html",type:"html",path:"/Users/thera/project/prototype/index.html",content:`<!doctype html>
<html><head><meta charset="utf-8"><style>body{font-family:system-ui;margin:0;background:#f4f0e8;color:#1e1e1e}main{max-width:760px;margin:80px auto;padding:0 32px}.tag{display:inline-block;border:1px solid #222;border-radius:999px;padding:6px 10px;font-size:12px}h1{font-size:64px;line-height:1;margin:28px 0 20px}p{font-size:20px;line-height:1.6;color:#555}button{margin-top:24px;border:0;background:#111;color:white;padding:14px 20px;border-radius:10px;font-size:16px}</style></head><body><main><span class="tag">LOCAL-FIRST</span><h1>Open a file.<br>See the whole context.</h1><p>A lightweight browser for Markdown and HTML folders.</p><button onclick="this.textContent='It works'">Try interaction</button></main></body></html>`},
        {name:"style.css",type:"text",path:"/Users/thera/project/prototype/style.css",content:`body {\n  font-family: system-ui;\n  background: #f4f0e8;\n}`}
      ]},
      {name:"assets",type:"folder",open:false,children:[{name:"cover.png",type:"image",path:"/Users/thera/project/assets/cover.png"}]}
    ];
    let currentFile=files[0],currentMode="split",dirty=false;
    function fileIcon(type,open=false){if(type==="folder")return open?"▾":"▸";if(type==="md")return"M↓";if(type==="html")return"⌘";if(type==="image")return"◫";return"•"}
    function renderTree(){const tree=document.getElementById("tree");tree.innerHTML="";files.forEach(item=>renderNode(item,0,tree))}
    function renderNode(item,depth,parent){const row=document.createElement("div");row.className="tree-row "+(item.type==="folder"?"folder ":"")+(currentFile===item?"active ":"")+(depth?"indent-"+depth:"");row.innerHTML=`<span class="icon">${fileIcon(item.type,item.open)}</span><span>${item.name}</span>`;row.onclick=()=>{if(item.type==="folder"){item.open=!item.open;renderTree()}else{currentFile=item;dirty=false;currentMode=item.type==="html"?"preview":item.type==="md"?"split":"edit";renderAll()}};parent.appendChild(row);if(item.type==="folder"&&item.open)item.children.forEach(child=>renderNode(child,depth+1,parent))}
    function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
    function mdToHtml(md){let html=escapeHtml(md);html=html.replace(/^### (.*)$/gm,"<h3>$1</h3>").replace(/^## (.*)$/gm,"<h2>$1</h2>").replace(/^# (.*)$/gm,"<h1>$1</h1>").replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/^> (.*)$/gm,"<blockquote>$1</blockquote>").replace(/^- (.*)$/gm,"<li>$1</li>").replace(/^\d+\. (.*)$/gm,"<li>$1</li>").replace(/\n{2,}/g,"</p><p>").replace(/\n/g,"<br>");html=html.replace(/(<li>.*?<\/li>)+/gs,m=>`<ul>${m}</ul>`);return`<div class="preview"><p>${html}</p></div>`}
    function renderContent(){const content=document.getElementById("content"),tabs=document.getElementById("modeTabs");tabs.style.display=["md","html","text"].includes(currentFile.type)?"flex":"none";document.querySelectorAll(".mode").forEach(b=>b.classList.toggle("active",b.dataset.mode===currentMode));content.className="content"+(currentMode==="split"?" split":"");content.innerHTML="";
      if(currentFile.type==="md"){if(currentMode==="edit"||currentMode==="split"){const w=document.createElement("div");w.className="editor-wrap";const ta=document.createElement("textarea");ta.value=currentFile.content;ta.oninput=e=>{currentFile.content=e.target.value;dirty=true;updateStatus();if(currentMode==="split"){const pv=document.querySelector(".preview-wrap");if(pv)pv.innerHTML=mdToHtml(currentFile.content)}};ta.onkeydown=e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="s"){e.preventDefault();dirty=false;updateStatus()}};w.appendChild(ta);if(currentMode==="edit"){const h=document.createElement("div");h.className="hint";h.textContent="⌘S 保存";w.appendChild(h)}content.appendChild(w)}if(currentMode==="preview"||currentMode==="split"){const p=document.createElement("div");p.className="preview-wrap";p.innerHTML=mdToHtml(currentFile.content);content.appendChild(p)}}
      else if(currentFile.type==="html"){if(currentMode==="edit"||currentMode==="split"){const w=document.createElement("div");w.className="editor-wrap";const ta=document.createElement("textarea");ta.value=currentFile.content;ta.oninput=e=>{currentFile.content=e.target.value;dirty=true;updateStatus();if(currentMode==="split"){const f=document.querySelector("iframe");if(f)f.srcdoc=currentFile.content}};w.appendChild(ta);content.appendChild(w)}if(currentMode==="preview"||currentMode==="split"){const w=document.createElement("div");w.className="html-wrap";const f=document.createElement("iframe");f.setAttribute("sandbox","allow-scripts");f.srcdoc=currentFile.content;w.appendChild(f);content.appendChild(w)}}
      else if(currentFile.type==="text"){const w=document.createElement("div");w.className="editor-wrap";const ta=document.createElement("textarea");ta.value=currentFile.content||"";ta.oninput=e=>{currentFile.content=e.target.value;dirty=true;updateStatus()};w.appendChild(ta);content.appendChild(w)}else content.innerHTML=`<div class="empty">该文件类型将在后续版本中支持预览。<br><br>${currentFile.name}</div>`}
    function updateStatus(){document.getElementById("windowTitle").textContent=`project / ${currentFile.name}`;document.getElementById("fileName").textContent=currentFile.name;document.getElementById("fileMeta").textContent=currentFile.type==="md"?"Markdown":currentFile.type==="html"?"HTML":currentFile.type==="image"?"Image":"Text";document.getElementById("pathText").textContent=currentFile.path||"";const state=document.getElementById("saveState");state.textContent=dirty?"未保存":"已保存";state.className=dirty?"dirty":"";document.getElementById("lineCount").textContent=`${(currentFile.content||"").split("\n").length} 行`}
    function renderAll(){renderTree();renderContent();updateStatus()}
    document.querySelectorAll(".mode").forEach(btn=>btn.onclick=()=>{currentMode=btn.dataset.mode;renderContent()});
    document.getElementById("openFolderBtn").onclick=()=>alert("原型中模拟：打开任意本地文件夹后，左侧直接显示真实目录树。");
    document.getElementById("revealBtn").onclick=()=>alert("原型中模拟：在 Finder 中定位当前文件。");
    renderAll();
  </script>
</body>
</html>
