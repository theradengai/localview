name: Verify published LocalView Beta 4 downloads

on:
  push:
    branches: [release/beta4-assets]
    paths: [.github/workflows/publish-beta4.yml]

permissions:
  contents: read

concurrency:
  group: publish-localview-v0.2.0-beta.4
  cancel-in-progress: false

jobs:
  verify-public-downloads:
    if: github.repository == 'theradengai/localview' && github.ref == 'refs/heads/release/beta4-assets'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download and checksum published assets without authentication
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from urllib.request import urlopen
          from pathlib import Path
          import hashlib, json, os
          base = 'https://github.com/theradengai/localview/releases/download/v0.2.0-beta.4/'
          expected = {
              'LocalView_0.2.0-beta.4_aarch64.dmg': '584d8ebc51d8ce50afd57e0a2bf0a034165133d458f749e91658beee0e4306af',
              'LocalView_0.2.0-beta.4_x64.dmg': '14bd31ec654e6049225896d744bf39d1128d8785a67b48f851633d94294e77d3',
              'SHA256SUMS.txt': 'e5f3b3c7c67567bb442136d321f6380d390cef672ee352ca2d0d76633cfbd96d',
              'BUILD-PROVENANCE.json': '9d18febcf8ab9548204e03c5b60eedfab59c30dc6c797195e0fbcebf6e84c115',
              'VALIDATION-SUMMARY.json': 'd2a9394125883da3f97873b0956b4c99cf9aa0c1607b393f4204a637e736356a',
          }
          def verify(item):
              name, sha = item
              with urlopen(base + name, timeout=45) as response:
                  assert response.status == 200, name
                  data = response.read(10000000)
                  assert not response.read(1), 'Unexpected asset size'
              actual = hashlib.sha256(data).hexdigest()
              assert actual == sha, (name, actual)
              if name == 'BUILD-PROVENANCE.json':
                  p = json.loads(data)
                  assert p['release_commit'] == 'b5533b5f4ebb5f0c0b0edf404987e4568941a963'
                  assert p['installer_source_commit'] == 'd50eedc17f40f8032cb698476ccf01d5cfb47c36'
              return {'name': name, 'http_status': 200, 'authentication': 'none', 'sha256': actual, 'bytes': len(data)}
          results = list(ThreadPoolExecutor(max_workers=5).map(verify, expected.items()))
          print(json.dumps(results, indent=2))
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('All five public Beta 4 release assets downloaded without authentication and matched their pinned SHA256 values.\n')
          PY
