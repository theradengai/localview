name: Publish verified LocalView Beta 4

on:
  push:
    branches: [release/beta4-assets]
    paths: [.github/workflows/publish-beta4.yml]

permissions:
  contents: read

concurrency:
  group: publish-localview-v0.2.0-beta.4
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'theradengai/localview' && github.ref == 'refs/heads/release/beta4-assets'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 31ce9a817c67ed10284031f522ff9167596ae4a8
          persist-credentials: false
      - name: Validate source and artifacts, then publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: b5533b5f4ebb5f0c0b0edf404987e4568941a963
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/publish-verified-beta4.py')
          text = path.read_text()
          old = 'X-GitHub-Api-Version: 2026-03-10'
          assert text.count(old) == 1
          path.write_text(text.replace(old, 'X-GitHub-Api-Version: 2022-11-28'))
          PY
          python3 scripts/publish-verified-beta4.py
