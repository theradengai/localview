name: Build reviewed Beta 3 candidate

on:
  push:
    branches: [fix/folder-multiselect]
    paths: [.github/workflows/build-reviewed-candidate.yml]

permissions:
  contents: read

concurrency:
  group: reviewed-beta3-candidate
  cancel-in-progress: false

jobs:
  integrate:
    if: github.repository == 'theradengai/localview' && github.ref == 'refs/heads/fix/folder-multiselect'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    outputs:
      source_sha: ${{ steps.commit.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Stop superseded Beta 2 candidate build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/theradengai/localview/actions/runs/34581260489 --jq .head_sha)" = d0dace94ad8d19a48e454a6f45bef4989961fb18
          status=$(gh api repos/theradengai/localview/actions/runs/34581260489 --jq .status)
          if [ "$status" != completed ]; then
            gh api --method POST repos/theradengai/localview/actions/runs/34581260489/cancel || echo 'Prior run already finishing; no candidate release will be published.'
          fi
      - name: Merge reviewed staging baseline without losing either change set
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin staging
          test "$(git rev-parse origin/staging)" = 1f480c505b35e5ce2fda04771270cd42900c8a18
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf 'src/App.test.tsx merge=union\nCHANGELOG.md merge=union\n' >> .git/info/attributes
          git merge --no-commit --no-ff origin/staging || true
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, re
          unresolved = subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U'], text=True).splitlines()
          for name in unresolved:
              text = Path(name).read_text()
              if name != 'src/App.tsx':
                  raise RuntimeError('Needs manual conflict review: ' + name)
              pattern = r'^<<<<<<<[^\n]*\n(.*?)^=======\n(.*?)^>>>>>>>[^\n]*\n'
              def resolve(match):
                  ours, theirs = match.group(1), match.group(2)
                  lines = [line for line in (ours + theirs).splitlines() if line.strip()]
                  if not all(line.lstrip().startswith('import ') and line.rstrip().endswith(';') for line in lines):
                      raise RuntimeError('Non-import App conflict needs review:\n' + match.group(0))
                  return '\n'.join(dict.fromkeys(lines)) + '\n'
              text, count = re.subn(pattern, resolve, text, flags=re.M | re.S)
              assert count and '<<<<<<<' not in text
              Path(name).write_text(text)
              subprocess.run(['git', 'add', name], check=True)
          assert not subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U'], text=True).strip()
          for name in ['package.json', 'package-lock.json', 'src-tauri/tauri.conf.json', 'src-tauri/Cargo.toml', 'src-tauri/Cargo.lock']:
              p=Path(name); text=p.read_text(); assert '0.2.0-beta.2' in text
              p.write_text(text.replace('0.2.0-beta.2', '0.2.0-beta.3'))
          p=Path('CHANGELOG.md'); text=p.read_text()
          text=text.replace('## 0.2.0-beta.2 — candidate (not released)', '## 0.2.0-beta.3 — candidate (not released)')
          p.write_text(text)
          p=Path('docs/FOLDER_SELECTION.md'); text=p.read_text().replace('0.2.0-beta.2 candidate review', '0.2.0-beta.3 candidate review')
          text += '\nThe Beta 3 candidate also includes staging commit 1f480c505b35e5ce2fda04771270cd42900c8a18, preserving its Markdown task/preview fixes. It does not replace or publish the separate Beta 2 release.\n'
          p.write_text(text)
          PY
          git diff --check
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build integrated frontend
        run: npm run build
      - name: Test integrated frontend
        run: |
          npm test -- --reporter=json --outputFile=beta3-tests.json > beta3-tests.log 2>&1 || { tail -160 beta3-tests.log; exit 1; }
          python3 - <<'PY'
          import json
          d=json.load(open('beta3-tests.json'))
          print('Frontend:',d['numPassedTests'],'passed;',d['numFailedTests'],'failed;',d['numPendingTests'],'pending')
          assert d['success'] and d['numFailedTests']==0 and d['numPendingTests']==0 and d['numPassedTests']>=400
          PY
      - name: Commit integrated candidate and remove one-shot workflow
        id: commit
        run: |
          git rm .github/workflows/build-reviewed-candidate.yml
          git add src/App.tsx src/App.test.tsx package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json docs/FOLDER_SELECTION.md CHANGELOG.md
          git commit -m 'Merge staging fixes into reviewed beta 3 multi-selection candidate'
          git push origin HEAD:refs/heads/fix/folder-multiselect
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Retain integrated test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: beta3-test-evidence
          path: |
            beta3-tests.json
            beta3-tests.log
          if-no-files-found: ignore
          retention-days: 14

  build:
    needs: integrate
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            architecture: arm64
          - target: x86_64-apple-darwin
            architecture: x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.integrate.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.91.1
          targets: ${{ matrix.target }}
          components: rustfmt
      - name: Check and test integrated candidate on macOS
        if: matrix.architecture == 'arm64'
        run: |
          npm test
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          cargo check --locked --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build Beta 3 candidate
        run: npm run tauri:build -- --target "${{ matrix.target }}" -- --locked
      - name: Verify architecture, signature, DMG and checksums
        env:
          BUNDLE_ROOT: src-tauri/target/${{ matrix.target }}/release/bundle
          EXPECTED_ARCH: ${{ matrix.architecture }}
          SOURCE_SHA: ${{ needs.integrate.outputs.source_sha }}
        run: |
          set -euo pipefail
          node scripts/verify-macos-bundle.mjs "$BUNDLE_ROOT/macos/LocalView.app" "$EXPECTED_ARCH"
          for image in "$BUNDLE_ROOT"/dmg/*.dmg; do hdiutil verify "$image"; done
          python3 - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ['BUNDLE_ROOT'])/'dmg'
          info={'version':'0.2.0-beta.3','source_commit':os.environ['SOURCE_SHA'],'staging_baseline':'1f480c505b35e5ce2fda04771270cd42900c8a18','architecture':os.environ['EXPECTED_ARCH'],'status':'candidate-not-public-release','native_ui_acceptance':'not-performed','notarized':False}
          (root/'BUILD-INFO.json').write_text(json.dumps(info,indent=2)+'\n')
          (root/'CANDIDATE-NOTES.txt').write_text('LocalView 0.2.0-beta.3 candidate\n\nDirectory multi-selection, safe batch move/Trash, plus existing staging Markdown/task fixes.\n\nTest installer, not a public release. macOS 12 or later. Ad-hoc signed, not Apple notarized. Quit the previous LocalView before replacing the app. Use disposable sample folders for initial acceptance. Native UI acceptance has not been performed.\n\nSource commit: '+os.environ['SOURCE_SHA']+'\n')
          PY
          cd "$BUNDLE_ROOT/dmg"
          shasum -a 256 ./*.dmg > SHA256SUMS.txt
      - name: Upload verified Beta 3 installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LocalView-0.2.0-beta.3-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/
          if-no-files-found: error
          retention-days: 14
