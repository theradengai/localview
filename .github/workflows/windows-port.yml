name: Assemble and validate Windows implementation
on:
  push:
    branches: [work/windows-20260916]
    paths: [.github/windows-port/**, .github/workflows/windows-port.yml]
permissions:
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {fetch-depth: 0}
      - name: Apply readable source changes to the exact published baseline
        run: |
          set -euo pipefail
          cp -R .github/windows-port "$RUNNER_TEMP/windows-port"
          git checkout --detach 4ae06b5678646f65b44ab1b6ecd66b36ceb82493
          git apply "$RUNNER_TEMP/windows-port/lib.patch"
          cp -R "$RUNNER_TEMP/windows-port/files/"* ./
          python3 "$RUNNER_TEMP/windows-port/prepare.py"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version-file: .nvmrc, cache: npm}
      - run: npm ci
      - name: Derive Windows icon from the existing application artwork
        run: |
          node node_modules/@tauri-apps/cli/tauri.js icon src-tauri/icons/icon.png --output "$RUNNER_TEMP/windows-icons"
          cp "$RUNNER_TEMP/windows-icons/icon.ico" src-tauri/icons/icon.ico
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with: {toolchain: 1.91.1, components: rustfmt}
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Preserve clean, reviewable feature source
        id: commit
        run: |
          set -euo pipefail
          test ! -e .github/windows-port
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src src-tauri package.json package-lock.json
          git commit -m 'feat: implement Windows local-file workspace and native filesystem operations'
          git push origin HEAD:refs/heads/feat/windows-desktop-20260916
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git archive --format=tar.gz HEAD > /tmp/localview-windows-source.tar.gz
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with: {name: windows-feature-source, path: /tmp/localview-windows-source.tar.gz, retention-days: 7}
  windows:
    needs: assemble
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.assemble.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version-file: .nvmrc, cache: npm}
      - run: npm ci
      - run: npm run build
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with: {toolchain: 1.91.1, components: rustfmt}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-rust-1.91-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: windows-rust-1.91-${{ hashFiles('src-tauri/Cargo.lock') }}-
      - name: Compile Windows backend
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/windows-evidence" | Out-Null
          cargo check --locked --manifest-path src-tauri/Cargo.toml 2>&1 | Tee-Object "$env:RUNNER_TEMP/windows-evidence/check.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test native Windows filesystem
        shell: pwsh
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml 2>&1 | Tee-Object "$env:RUNNER_TEMP/windows-evidence/tests.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify recycle-only behavior using a disposable fixture
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml windows_recycle_bin_real_fixture -- --ignored --nocapture
      - name: Save compilation cache even when an application assertion fails
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-rust-1.91-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.run_id }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: windows-native-evidence
          path: ${{ runner.temp }}/windows-evidence/
          retention-days: 14
          if-no-files-found: warn
