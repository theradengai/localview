name: Correct native PDF stream verification
on:
  push:
    branches: [ci/windows-pdf-acceptance-20260916]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {fetch-depth: 0}
      - name: Separate the PDF stream from the viewer navigation wrapper
        run: |
          set -euo pipefail
          git checkout --detach d1769c28b87dc5ff942cf3744e63151d368a7d21
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/verify-windows-native.mjs'); s=p.read_text()
          before="  assert.match((await pdfResponse.body()).toString('utf8').slice(0,8),/^%PDF-/);\n  await new Promise(resolve=>setTimeout(resolve,2500));"
          after='''  // A PDF navigation is handed to WebView2's built-in viewer, so CDP may
            // expose its generated HTML wrapper as the navigation response body.
            // Read the exact same resource inside the same-origin document frame;
            // never loosen application CSP/CORS or intercept/replace response bytes.
            const pdfHandle = await page.locator('iframe[title="sample.pdf"]').elementHandle();
            const pdfDocument = await pdfHandle.contentFrame();
            assert.ok(pdfDocument, 'PDF document frame missing');
            const streamResult = await pdfDocument.evaluate(async url => {
              const response = await fetch(url);
              const content = await response.text();
              return { status: response.status, type: response.headers.get('content-type'), content };
            }, pdfSource);
            assert.equal(streamResult.status, 200);
            assert.match(streamResult.type, /application\\/pdf/);
            assert.equal(streamResult.content, pdf, 'Scoped PDF stream differs from the original fixture');
            report.pdfStream = { status: streamResult.status, type: streamResult.type, exactFixtureMatch: true };
            assert.equal(await fs.readFile(path.join(root,'sample.pdf'),'utf8'),pdf);
            await new Promise(resolve=>setTimeout(resolve,8000));
            report.pdfFrames = await Promise.all(page.frames().map(async item => ({
              url: item.url(),
              markup: await item.evaluate(() => document.documentElement.outerHTML.slice(0,12000)).catch(()=>'Unavailable plugin frame'),
            })));'''
          assert s.count(before)==1
          s=s.replace(before,after)
          p.write_text(s)
          PY
          node --check scripts/verify-windows-native.mjs
          git diff --check
      - name: Commit the test-only correction
        id: commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-windows-native.mjs
          git commit -m 'test(windows): verify original PDF stream separately from WebView2 viewer wrapper'
          git push origin HEAD:refs/heads/test/windows-pdf-stream-20260916
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  installed:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version-file: .nvmrc}
      - name: Verify the unchanged binary with the corrected PDF test
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --exit-code d1769c28b87dc5ff942cf3744e63151d368a7d21 HEAD -- src src-tauri package.json package-lock.json
          if ($LASTEXITCODE -ne 0) { throw 'Runtime source changed' }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/pdf-evidence", "$env:RUNNER_TEMP/installer" | Out-Null
          gh run download 35098185216 --repo theradengai/localview --name LocalView-Windows-x64 --dir "$env:RUNNER_TEMP/installer"
          if ($LASTEXITCODE -ne 0) { throw 'Installer download failed' }
          $manifest = Get-Content "$env:RUNNER_TEMP/installer/BUILD-PROVENANCE.json" | ConvertFrom-Json
          $file = Join-Path "$env:RUNNER_TEMP/installer" $manifest.installer
          if ((Get-FileHash $file -Algorithm SHA256).Hash.ToLower() -ne $manifest.sha256) { throw 'Installer hash mismatch' }
          Copy-Item "$env:RUNNER_TEMP/installer/BUILD-PROVENANCE.json" "$env:RUNNER_TEMP/pdf-evidence/ORIGINAL-BUILD-PROVENANCE.json"
          ./scripts/verify-windows-install.ps1 -Installer $file -Evidence "$env:RUNNER_TEMP/pdf-evidence"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: windows-pdf-viewer-evidence
          path: ${{ runner.temp }}/pdf-evidence/
          retention-days: 14
          if-no-files-found: error
