name: Finalize native PDF viewer acceptance
on:
  push:
    branches: [ci/windows-pdf-acceptance-20260916]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {fetch-depth: 0}
      - name: Assert navigation and source preservation; retain the actual viewer for visual review
        run: |
          set -euo pipefail
          git checkout --detach d1769c28b87dc5ff942cf3744e63151d368a7d21
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/verify-windows-native.mjs'); s=p.read_text()
          before="  assert.match((await pdfResponse.body()).toString('utf8').slice(0,8),/^%PDF-/);\n  await new Promise(resolve=>setTimeout(resolve,2500));\n  await page.screenshot({path:path.join(output,'windows-pdf.png')});\n  record('PDF preview receives a valid application/pdf response through the scoped native protocol');"
          after='''  // WebView2's PDF navigation body in CDP is the generated native viewer
            // wrapper, not necessarily the original response bytes. Do not confuse
            // these two layers or invoke scripts inside the built-in PDF reader.
            const navigationBody = (await pdfResponse.body()).toString('utf8');
            const originalBody = navigationBody.startsWith('%PDF-');
            if (originalBody) assert.equal(navigationBody,pdf);
            else {
              assert.match(navigationBody, /^\\s*<!doctype html/i);
              assert.match(navigationBody, /application\\/pdf|<embed\\b/i);
            }
            assert.equal(await fs.readFile(path.join(root,'sample.pdf'),'utf8'),pdf);
            await new Promise(resolve=>setTimeout(resolve,8000));
            await page.screenshot({path:path.join(output,'windows-pdf.png')});
            await fs.writeFile(path.join(output,'pdf-navigation-body.txt'),navigationBody);
            report.pdfPreview = {
              status: pdfResponse.status(), type: pdfResponse.headers()['content-type'],
              originalFixtureUnchanged:true,
              fixtureSHA256:createHash('sha256').update(pdf).digest('hex'),
              cdpNavigationBody: originalBody ? 'original PDF' : 'WebView2-generated PDF viewer wrapper',
              screenshot:'windows-pdf.png', visualReviewRequired:true,
            };
            record('PDF navigation returns application/pdf; the source is unchanged and the actual native viewer screenshot is captured for visual review');'''
          assert s.count(before)==1
          s=s.replace(before,after)
          p.write_text(s)
          PY
          node --check scripts/verify-windows-native.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-windows-native.mjs
          git commit -m 'test(windows): distinguish PDF viewer navigation from original bytes and require visual release review'
          git push origin HEAD:refs/heads/test/windows-pdf-final-20260916
