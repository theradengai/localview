name: Check native launch-media capture capability
on:
  push:
    branches: [media/native-capture-probe-20260917]
    paths: [.github/workflows/media-native-capability.yml]
permissions:
  contents: read
jobs:
  capture-capability:
    runs-on: macos-15
    timeout-minutes: 3
    steps:
      - name: Check existing screen and accessibility permissions without changing them
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/media-capability"
          cat > "$RUNNER_TEMP/media-capability/probe.swift" <<'SWIFT'
          import Foundation
          import CoreGraphics
          import ApplicationServices
          let report: [String: Any] = [
            "screenCaptureAuthorized": CGPreflightScreenCaptureAccess(),
            "accessibilityAuthorized": AXIsProcessTrusted(),
            "screenWidth": CGDisplayPixelsWide(CGMainDisplayID()),
            "screenHeight": CGDisplayPixelsHigh(CGMainDisplayID()),
            "os": ProcessInfo.processInfo.operatingSystemVersionString,
            "securitySettingsModified": false,
            "personalDesktopAccessed": false
          ]
          print(String(data: try JSONSerialization.data(withJSONObject: report, options: [.prettyPrinted, .sortedKeys]), encoding: .utf8)!)
          SWIFT
          /usr/bin/swift "$RUNNER_TEMP/media-capability/probe.swift" | tee "$RUNNER_TEMP/media-capability/result.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: native-media-capability
          path: ${{ runner.temp }}/media-capability/
          retention-days: 3
