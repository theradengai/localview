name: Check LocalView

on:
  workflow_dispatch:
  push:
    branches: [main, staging]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit locked frontend dependencies
        run: npm audit --audit-level=low

      - name: Build frontend
        run: npm run build

      - name: Test frontend
        run: npm test

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.91.1
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Check Tauri crate
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Test Tauri crate
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Exercise real macOS Trash with disposable fixtures
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml macos_moves_unique_ -- --ignored --test-threads=1
