name: Validate Markdown Kanban implementation
on:
  push:
    branches: [feat/markdown-kanban]
    paths: [.github/workflows/kanban-bootstrap.yml]
permissions:
  contents: read
concurrency:
  group: kanban-implementation-bootstrap
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply verified source delta
        run: |
          set -euo pipefail
          mkdir -p /tmp/kanban-evidence
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib
          names = ['scripts/kanban-implementation.part1'] + [f'scripts/kanban-implementation.part2-{i:02}' for i in range(1, 10)]
          encoded = ''.join(pathlib.Path(p).read_text().strip() for p in names)
          data = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(data).hexdigest() == '92d4effb5544c3e53ea38dc2eb01657864e11dac907cbea598c48b04864af6a6'
          entries = json.loads(data)
          allowed = {'docs/KANBAN.md', 'docs/fixtures/kanban.md', 'scripts/verify-kanban-browser.mjs', 'src/App.test.tsx', 'src/App.tsx', 'src/components/FileTree.tsx', 'src/components/KanbanBoard.test.tsx', 'src/components/KanbanBoard.tsx', 'src/components/MarkdownPreview.tsx', 'src/components/TextEditor.test.tsx', 'src/components/TextEditor.tsx', 'src/components/kanban.css', 'src/lib/kanban.test.ts', 'src/lib/kanban.ts'}
          assert len(entries) == len(allowed) and {e['path'] for e in entries} == allowed
          results = {}
          for e in entries:
              p = pathlib.Path(e['path'])
              if e['before'] is None:
                  assert not p.exists(), e['path']
                  results[p] = e['content']
              else:
                  text = p.read_text(encoding='utf-8')
                  assert hashlib.sha256(text.encode()).hexdigest() == e['before'], e['path']
                  last = len(text)
                  for start, end, insert in reversed(e['edits']):
                      assert 0 <= start <= end <= last
                      text = text[:start] + insert + text[end:]
                      last = start
                  results[p] = text
          for p, text in results.items():
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text, encoding='utf-8')
          pathlib.Path('/tmp/kanban-evidence/implementation-paths.txt').write_text('\n'.join(sorted(allowed)) + '\n')
          pathlib.Path('/tmp/kanban-evidence/source-delta.sha256').write_text(hashlib.sha256(data).hexdigest() + '\n')
          print(f'Applied {len(entries)} verified source files; dependency lockfiles and native permissions unchanged.')
          PY
          git diff --check
      - run: npm ci
      - name: Audit and build
        run: |
          set -euo pipefail
          npm audit --json > /tmp/kanban-evidence/npm-audit.json
          npm run build 2>&1 | tee /tmp/kanban-evidence/build.log
      - name: Run complete frontend tests
        run: |
          set -euo pipefail
          npm test -- --reporter=default --reporter=json --outputFile=/tmp/kanban-evidence/tests.json 2>&1 | tee /tmp/kanban-evidence/tests.log
      - name: Commit validated source without changing release branches
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = feat/markdown-kanban
          git fetch origin feat/markdown-kanban
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          while IFS= read -r path; do git add -- "$path"; done < /tmp/kanban-evidence/implementation-paths.txt
          git rm scripts/kanban-implementation.part1 scripts/kanban-implementation.part2-0*
          git diff --cached --check
          git commit -m 'feat: add Markdown-backed interactive Kanban with shared history and safe saves'
          git push origin HEAD:feat/markdown-kanban
          git rev-parse HEAD > /tmp/kanban-evidence/SOURCE_SHA.txt
          git archive --format=tar.gz HEAD > /tmp/kanban-evidence/source.tar.gz
          test -z "$(git status --porcelain)"
      - name: Install isolated browser validation tools
        run: |
          npm install --prefix /tmp/localview-browser --ignore-scripts --save-exact playwright@1.58.2
          /tmp/localview-browser/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Exercise production Kanban in Chromium and WebKit
        run: node scripts/verify-kanban-browser.mjs /tmp/localview-browser/package.json /tmp/kanban-evidence/browser
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: kanban-implementation-evidence
          path: /tmp/kanban-evidence/
          retention-days: 14
          if-no-files-found: error
