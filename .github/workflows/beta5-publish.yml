name: Publish verified LocalView Beta 5
on:
  push:
    branches: [ci/beta5-release-tools]
    paths: [.github/workflows/beta5-publish.yml]
permissions:
  contents: read
concurrency:
  group: publish-localview-v0.2.0-beta.5
  cancel-in-progress: false
jobs:
  wait-for-main:
    if: github.repository == 'theradengai/localview' && github.ref == 'refs/heads/ci/beta5-release-tools'
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    permissions:
      contents: read
      actions: read
    steps:
      - name: Await exact release main checks without mutations
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: 3ebf48f9f917bc1296ea65cd9e5bb78cd8990255
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          root = 'https://api.github.com/repos/theradengai/localview'
          sha = os.environ['RELEASE_SHA']
          def get(path):
              req = urllib.request.Request(root + path, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=45) as response:
                  return json.load(response)
          for attempt in range(45):
              for branch in ['main', 'staging']:
                  if get('/git/ref/heads/' + branch)['object']['sha'] != sha:
                      raise RuntimeError('Release branch changed: ' + branch)
              runs = get('/actions/runs?head_sha=' + sha + '&per_page=100')['workflow_runs']
              ready = True
              for path in ['.github/workflows/check.yml', '.github/workflows/kanban.yml']:
                  selected = [r for r in runs if r['path'] == path and r['head_sha'] == sha and r['head_branch'] == 'main' and r['event'] == 'push']
                  if not selected:
                      ready = False
                      continue
                  last = max(selected, key=lambda r: r['id'])
                  print(path, last['status'], last['conclusion'], flush=True)
                  if last['status'] == 'completed':
                      if last['conclusion'] != 'success':
                          raise RuntimeError('Main check failed: ' + path)
                  else:
                      ready = False
              if ready:
                  print('Both exact main checks passed', flush=True)
                  break
              time.sleep(15)
          else:
              raise RuntimeError('Main check wait timed out; no release was published')
          PY
  publish:
    needs: wait-for-main
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: cfc03870ac70db78bcc4694906e9f041f07f71fb
          persist-credentials: false
      - name: Validate pinned artifacts and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: 3ebf48f9f917bc1296ea65cd9e5bb78cd8990255
        run: python3 scripts/publish-beta5-release.py
      - name: Retain publication and public-download evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: beta5-publication-proof
          path: /tmp/beta5-publication/
          if-no-files-found: error
          retention-days: 14
