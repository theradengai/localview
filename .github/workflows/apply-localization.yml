name: Assemble reviewed bilingual interface branch
on:
  push:
    branches: [work/localization-20260915]
    paths: [.github/workflows/apply-localization.yml, .github/localization-part-1.bin, .github/localization-part-2.bin]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Reconstruct the same validated feature files on the original main commit
        run: |
          set -euo pipefail
          cat .github/localization-part-1.bin .github/localization-part-2.bin > /tmp/localization.xz
          cp .github/apply-localization.py /tmp/apply-localization.py
          git checkout --detach 20b2e42f560180b385c2aa512b7bcafd61676e47
          python /tmp/apply-localization.py /tmp/localization.xz
          git restore .github/workflows/kanban.yml
      - name: Commit application changes only
        run: |
          set -euo pipefail
          test ! -e .github/localization-part-1.bin
          test ! -e .github/workflows/apply-localization.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src src-tauri scripts docs README.md README.zh-CN.md CHANGELOG.md
          git commit -m 'feat: add persistent Chinese and English interface'
          git push origin HEAD:refs/heads/feat/chinese-english-ui-20260915
          git show --stat --oneline HEAD
