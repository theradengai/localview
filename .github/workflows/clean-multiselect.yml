name: Clean multi-selection candidate
on:
  push:
    branches: [fix/folder-multiselect]
    paths: [.github/workflows/clean-multiselect.yml]
permissions:
  contents: read
concurrency:
  group: clean-multiselect-candidate
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      source: ${{ steps.commit.outputs.source }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install exact dependencies and retain baseline
        run: |
          set -euo pipefail
          mkdir -p /tmp/clean-evidence
          cp package-lock.json /tmp/clean-evidence/package-lock-before.json
          npm ci
          npm audit --json > /tmp/clean-evidence/audit-before.json || test "$?" = 1
      - name: Apply compatible development fixes and consistent candidate metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('package.json'); package=json.loads(p.read_text())
          assert package['version']=='0.2.0-beta.3'
          package['version']='0.2.0-beta.4'
          package['devDependencies']['vitest']='^4.1.11'
          p.write_text(json.dumps(package,indent=2)+'\n')
          for filename in ['src-tauri/Cargo.toml','src-tauri/Cargo.lock']:
              p=pathlib.Path(filename); text=p.read_text()
              old='name = "localview"\nversion = "0.2.0-beta.3"'
              assert text.count(old)==1, filename
              p.write_text(text.replace(old,'name = "localview"\nversion = "0.2.0-beta.4"'))
          p=pathlib.Path('src-tauri/tauri.conf.json'); data=json.loads(p.read_text())
          assert data['version']=='0.2.0-beta.3'
          data['version']='0.2.0-beta.4'; p.write_text(json.dumps(data,indent=2)+'\n')
          for filename in ['.github/workflows/check.yml','.github/workflows/build-macos.yml']:
              p=pathlib.Path(filename); text=p.read_text()
              text=text.replace('11d5960a326750d5838078e36cf38b85af677262 # v4','d23441a48e516b6c34aea4fa41551a30e30af803 # v6')
              text=text.replace('49933ea5288caeca8642d1e84afbd3f7d6820020 # v4','249970729cb0ef3589644e2896645e5dc5ba9c38 # v6')
              text=text.replace('ea165f8d65b6e75b540449e92b4886f43607fa02 # v4','b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6')
              p.write_text(text)
          p=pathlib.Path('.github/workflows/check.yml'); text=p.read_text()
          anchor='      - name: Build frontend\n'
          assert text.count(anchor)==1
          text=text.replace(anchor,'      - name: Audit locked frontend dependencies\n        run: npm audit --audit-level=low\n\n'+anchor)
          text += '\n      - name: Exercise real macOS Trash with disposable fixtures\n        run: cargo test --locked --manifest-path src-tauri/Cargo.toml macos_moves_unique_ -- --ignored --test-threads=1\n'
          p.write_text(text)
          p=pathlib.Path('CHANGELOG.md'); text=p.read_text()
          heading='## 0.2.0-beta.4 (candidate)\n\n- Retain confirmed batch progress and remaining selections on rejected operations; empty errors never report success.\n- Update vulnerable development/test dependencies within existing compatible ranges and enforce npm audit in CI.\n- Add production Chromium/WebKit multi-selection regression checks and explicitly run isolated native Trash smoke tests in macOS CI.\n- Refresh locked-dependency notices and Node 24 GitHub Actions. Candidate only; no public release or Apple notarization is implied.\n\n'
          first=text.find('\n')+1; p.write_text(text[:first]+'\n'+heading+text[first:].lstrip('\n'))
          p=pathlib.Path('docs/FOLDER_SELECTION.md'); text=p.read_text()
          text+='\n## 0.2.0-beta.4 validation\n\nThe next candidate retains confirmed progress on thrown or empty batch errors. Development-only dependency fixes are bounded by a production-lock comparison and a zero-vulnerability npm audit gate. `scripts/verify-tree-selection-browser.mjs` exercises the production in-memory demo in Chromium and WebKit, including real pointer group drag, cancellation and confirmation. macOS CI explicitly runs the two disposable native Trash tests that remain opt-in for local contributors. Browser checks plus native command tests are not a physical-device manual acceptance claim. Installers and evidence identify the exact source commit; this remains a non-notarized candidate, not a public release.\n'
          p.write_text(text)
          PY
          npm audit fix --package-lock-only --ignore-scripts
          npm ci
          python3 - <<'PY'
          import json
          before=json.load(open('/tmp/clean-evidence/package-lock-before.json'))['packages']
          after=json.load(open('package-lock.json'))['packages']
          changes=[]
          for key, old in before.items():
              if not key: continue
              new=after.get(key,{})
              if old.get('version')!=new.get('version'):
                  assert old.get('dev') and new.get('dev'), f'Unexpected production dependency change: {key}'
                  changes.append({'package':key,'from':old.get('version'),'to':new.get('version')})
          for key, new in after.items():
              if key and key not in before: assert new.get('dev'), f'Unexpected production addition: {key}'
          json.dump(changes,open('/tmp/clean-evidence/dependency-changes.json','w'),indent=2)
          PY
          npm audit --json > /tmp/clean-evidence/audit-after.json
          npm audit --omit=dev --json > /tmp/clean-evidence/audit-production-after.json
      - name: Verify frontend and new rejection regressions
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee /tmp/clean-evidence/frontend-build.log
          npm test -- --reporter=default --reporter=json --outputFile=/tmp/clean-evidence/frontend-tests.json 2>&1 | tee /tmp/clean-evidence/frontend-tests.log
      - name: Exercise production interactions in Chromium and WebKit
        run: |
          set -euo pipefail
          npm install --prefix /tmp/localview-browser --ignore-scripts --save-exact playwright@1.58.2
          /tmp/localview-browser/node_modules/.bin/playwright install --with-deps chromium webkit
          node scripts/verify-tree-selection-browser.mjs /tmp/localview-browser/package.json /tmp/clean-evidence/browser
      - name: Install release Rust and license sources
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.91.1
          components: rust-docs
      - name: Regenerate and verify distributable notices
        run: |
          set -euo pipefail
          # Offline Cargo metadata also reads non-target manifests in the lock graph.
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
          node scripts/generate-third-party-notices.mjs
          git diff > /tmp/clean-evidence/reviewed.patch
          node scripts/generate-third-party-notices.mjs --check
          git diff --check
          git diff --stat > /tmp/clean-evidence/change-stat.txt
      - name: Commit validated source and remove one-shot workflow
        id: commit
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = fix/folder-multiselect
          git fetch origin fix/folder-multiselect
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/clean-multiselect.yml
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json CHANGELOG.md docs/FOLDER_SELECTION.md THIRD_PARTY_NOTICES.md .github/workflows/check.yml .github/workflows/build-macos.yml
          git commit -m 'fix: close dependency audit gaps and validate beta 4 candidate'
          git push origin HEAD:fix/folder-multiselect
          sha=$(git rev-parse HEAD)
          echo "source=$sha" >> "$GITHUB_OUTPUT"
          echo "$sha" > /tmp/clean-evidence/SOURCE_SHA.txt
          git archive --format=tar.gz HEAD > /tmp/clean-evidence/source.tar.gz
          test -z "$(git status --porcelain)"
      - name: Retain clean-validation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: beta4-clean-evidence
          path: /tmp/clean-evidence/
          retention-days: 14
          if-no-files-found: error
  build:
    needs: repair
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x86_64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.repair.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.91.1
          targets: ${{ matrix.target }}
          components: rustfmt,rust-docs
      - name: Audit and test immutable source on macOS
        if: matrix.arch == 'arm64'
        run: |
          set -euo pipefail
          mkdir -p /tmp/native-evidence
          npm audit --json > /tmp/native-evidence/npm-audit.json
          npm test 2>&1 | tee /tmp/native-evidence/frontend-tests.log
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          cargo check --locked --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee /tmp/native-evidence/rust-tests.log
          cargo test --locked --manifest-path src-tauri/Cargo.toml macos_moves_unique_ -- --ignored --test-threads=1 2>&1 | tee /tmp/native-evidence/trash-smoke.log
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
          node scripts/generate-third-party-notices.mjs --check
      - name: Build exact candidate
        run: npm run tauri:build -- --target "${{ matrix.target }}" -- --locked
      - name: Verify bundle and actual read-only installer contents
        env:
          BUNDLE_ROOT: src-tauri/target/${{ matrix.target }}/release/bundle
          EXPECTED_ARCH: ${{ matrix.arch }}
          SOURCE_SHA: ${{ needs.repair.outputs.source }}
        run: |
          set -euo pipefail
          node scripts/verify-macos-bundle.mjs "$BUNDLE_ROOT/macos/LocalView.app" "$EXPECTED_ARCH"
          for image in "$BUNDLE_ROOT"/dmg/*.dmg; do
            hdiutil verify "$image"
            mount=$(mktemp -d /tmp/localview-dmg-XXXXXX)
            hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$image"
            node scripts/verify-macos-bundle.mjs "$mount/LocalView.app" "$EXPECTED_ARCH"
            cmp "$mount/LocalView.app/Contents/MacOS/localview" "$BUNDLE_ROOT/macos/LocalView.app/Contents/MacOS/localview"
            hdiutil detach "$mount"
            rmdir "$mount"
          done
          python3 - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ['BUNDLE_ROOT'])/'dmg'
          info={'version':'0.2.0-beta.4','source_commit':os.environ['SOURCE_SHA'],'architecture':os.environ['EXPECTED_ARCH'],'status':'candidate-not-public-release','npm_audit_vulnerabilities':0,'browser_validation':'Chromium and WebKit production demo','native_trash_validation':'two disposable real macOS Trash fixtures','physical_device_ui_acceptance':'not-performed','notarized':False}
          (root/'BUILD-INFO.json').write_text(json.dumps(info,indent=2)+'\n')
          (root/'CANDIDATE-NOTES.txt').write_text('LocalView 0.2.0-beta.4 candidate\nDirectory multi-selection and batch operations, prior staging Markdown fixes, clean npm audit and rejection accounting.\nmacOS 12+. Ad-hoc signed, not Apple notarized. Quit the old app before replacing it. Initial device acceptance should use disposable sample folders.\nSource: '+os.environ['SOURCE_SHA']+'\n')
          PY
          cd "$BUNDLE_ROOT/dmg"
          shasum -a 256 ./*.dmg > SHA256SUMS.txt
      - name: Launch candidate with a disposable synthetic workspace
        if: matrix.arch == 'arm64'
        env:
          APP: src-tauri/target/aarch64-apple-darwin/release/bundle/macos/LocalView.app
        run: |
          set -euo pipefail
          fixture=$(mktemp -d /tmp/localview-launch-XXXXXX)
          mkdir -p "$fixture/alpha" "$fixture/beta" "$fixture/target"
          touch "$fixture/.localview-root"
          printf '# Synthetic LocalView launch fixture\nNo personal documents.\n' > "$fixture/README.md"
          "$APP/Contents/MacOS/localview" "$fixture/README.md" > /tmp/native-evidence/app-launch.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; rm -rf "$fixture"' EXIT
          sleep 5
          kill -0 "$pid"
          printf 'Native candidate process launched and remained running with an isolated fixture. This is not interactive UI acceptance.\n' > /tmp/native-evidence/app-launch-result.txt
      - name: Retain native evidence
        if: always() && matrix.arch == 'arm64'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: beta4-native-evidence
          path: /tmp/native-evidence/
          retention-days: 14
      - name: Upload verified candidate installer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: LocalView-0.2.0-beta.4-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/
          retention-days: 14
          if-no-files-found: error
