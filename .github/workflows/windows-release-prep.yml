name: Prepare Windows release checks
on:
  push:
    branches: [ci/windows-release-prep-20260916]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/windows-desktop-20260916
          fetch-depth: 0
      - name: Apply bounded test and notice changes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 7a3726b1d971bd962b93772d2c4f6ba5e3386d1c
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/TextEditor.test.tsx'); s=p.read_text()
          old="fireEvent.keyDown(content, { key: 'z', ctrlKey: true });"
          assert s.count(old)==2
          p.write_text(s.replace(old,"fireEvent.keyDown(content, { key: 'z', metaKey: /Mac/.test(navigator.platform), ctrlKey: !/Mac/.test(navigator.platform) });"))
          p=Path('scripts/generate-third-party-notices.mjs'); s=p.read_text()
          old="const targets = ['aarch64-apple-darwin', 'x86_64-apple-darwin'];"
          assert s.count(old)==1
          s=s.replace(old,"const targets = ['aarch64-apple-darwin', 'x86_64-apple-darwin', 'x86_64-pc-windows-msvc'];")
          old="    } else if (pkg.name === 'alloc-stdlib' && pkg.license === 'BSD-3-Clause') {"
          assert s.count(old)==1
          insert="""    } else if (['webview2-com', 'webview2-com-macros', 'webview2-com-sys'].includes(pkg.name) && pkg.license === 'MIT' && pkg.repository?.replace(/\\.git$/, '').replace(/\\/$/, '') === 'https://github.com/wravery/webview2-rs') {
                docs.push(upstream(rawUrl('wravery/webview2-rs', revision, 'LICENSE')));
                selection = 'The published wrapper crate omits its repository-level MIT license file. The exact source revision license is reproduced here. Microsoft WebView2 Runtime remains a separately licensed Microsoft component, not covered by this wrapper license.';
          """
          s=s.replace(old,insert+old)
          p.write_text(s)
          PY
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version-file: .nvmrc, cache: npm}
      - run: npm ci
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with: {toolchain: 1.91.1, components: 'rustfmt,rust-docs'}
      - name: Generate distribution notices from locked sources
        run: |
          set -euo pipefail
          mkdir -p /tmp/windows-prep
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml > /tmp/windows-prep/fetch.log 2>&1
          node scripts/generate-third-party-notices.mjs --refresh-upstream 2>&1 | tee /tmp/windows-prep/notices.log
          node scripts/generate-third-party-notices.mjs --check
          cargo fmt --manifest-path src-tauri/Cargo.toml
          npm test 2>&1 | tee /tmp/windows-prep/tests.log
          npm run build 2>&1 | tee /tmp/windows-prep/build.log
      - name: Commit verified source changes only
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/TextEditor.test.tsx scripts/generate-third-party-notices.mjs THIRD_PARTY_NOTICES.md docs/licenses/upstream-license-cache.json src-tauri/src
          git commit -m 'test: normalize modifier keys and include Windows dependency notices'
          git push origin HEAD:refs/heads/feat/windows-desktop-20260916
          git archive --format=tar.gz HEAD > /tmp/windows-prep/windows-release-source.tar.gz
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: windows-release-source
          path: /tmp/windows-prep/
          retention-days: 3
          if-no-files-found: error
