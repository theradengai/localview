name: Verify Kanban demo persistence fix
on:
  push:
    branches: [feat/markdown-kanban]
    paths: [.github/workflows/kanban-demo-fix.yml]
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply reviewed demo persistence fix and regressions
        run: |
          python3 - <<'PY'
          import hashlib, pathlib
          p = pathlib.Path('src/App.tsx'); source = p.read_text()
          assert hashlib.sha256(source.encode()).hexdigest() == 'c4c273901ef845f89859b83b832a93167f073948b729cbe44ae509a4bfc0980e'
          old = '          if (!desktop) return `browser-demo-${candidate.revision}`;'
          new = '''          if (!desktop) {
                      if (target.workspaceEpoch !== workspaceEpochRef.current || !findNode(treeRef.current, target.path)) {
                        throw new Error('DOCUMENT_CHANGED: demo save target changed');
                      }
                      const next = updateNode(treeRef.current, target.path, node => ({ ...node, demoContent: candidate.content }));
                      treeRef.current = next;
                      setTree(next);
                      const committed = committedWorkspaceSnapshotRef.current;
                      if (committed) committed.tree = next;
                      return `browser-demo-${candidate.revision}`;
                    }'''
          # Match source indentation exactly rather than the indentation of this script.
          new = new.replace('\n                    ', '\n          ')
          assert source.count(old) == 1
          source = source.replace(old, new)
          old = "snapshot?.content ?? node.demoContent ?? ''"
          assert source.count(old) == 1
          source = source.replace(old, "snapshot?.content ?? findNode(treeRef.current, targetPath)?.demoContent ?? node.demoContent ?? ''")
          p.write_text(source)
          p = pathlib.Path('src/App.test.tsx'); source = p.read_text()
          assert hashlib.sha256(source.encode()).hexdigest() == 'cd6d3d5abf2c068d21da2b869c2a7bc65e30ee403b5b726a96be637a191b6ffc'
          anchor = "  it('creates a board exclusively"
          assert source.count(anchor) == 1
          tests = r'''  it('keeps a newly created demo board after save-guarded file switching', async () => {
              const user = userEvent.setup();
              render(<App />);
              await user.click(screen.getByRole('button', { name: '在 PROJECT 根目录新建' }));
              await user.click(screen.getByRole('menuitem', { name: '新建看板' }));
              await user.type(screen.getByRole('textbox', { name: '在 project 中新建看板文件' }), 'Demo Board{Enter}');
              await screen.findByLabelText('Markdown 看板');
              await user.click(screen.getAllByRole('button', { name: '＋ 添加卡片' })[0]);
              await user.type(screen.getByLabelText('新卡片标题'), 'Retained card{Enter}{Escape}');
              await user.click(screen.getByRole('button', { name: 'Retained card' }));
              fireEvent.change(screen.getByLabelText('卡片说明与子任务'), { target: { value: 'Keep this description\n- [ ] child' } });
              await user.click(screen.getByRole('button', { name: 'README.md' }));
              await screen.findByRole('heading', { name: 'Local Folder Viewer' });
              await user.click(screen.getByRole('button', { name: 'Demo Board.md' }));
              await user.click(await screen.findByRole('button', { name: 'Retained card' }));
              expect(screen.getByLabelText('卡片说明与子任务')).toHaveProperty('value', 'Keep this description\n- [ ] child');
              expect(mocks.writeTextFile).not.toHaveBeenCalled();
            });

            it('keeps ordinary demo Markdown in the same in-memory file tree after switching', async () => {
              const user = userEvent.setup(); render(<App />);
              await user.click(screen.getByRole('button', { name: '编辑' }));
              fireEvent.change(screen.getByRole('textbox', { name: 'editor' }), { target: { value: '# Preserved demo Markdown' } });
              await user.click(screen.getByRole('button', { name: 'roadmap.md' }));
              await screen.findByRole('heading', { name: 'Roadmap' });
              await user.click(screen.getByRole('button', { name: 'README.md' }));
              await screen.findByRole('heading', { name: 'Preserved demo Markdown' });
              expect(mocks.writeTextFile).not.toHaveBeenCalled();
            });

          '''
          tests = tests.replace('\n          ', '\n')
          source = source.replace(anchor, tests + anchor)
          p.write_text(source)
          PY
      - run: npm ci
      - name: Validate full frontend and audit
        run: |
          set -euo pipefail
          mkdir -p /tmp/kanban-demo-evidence
          npm audit --json > /tmp/kanban-demo-evidence/audit.json
          npm run build 2>&1 | tee /tmp/kanban-demo-evidence/build.log
          npm test -- --reporter=default --reporter=json --outputFile=/tmp/kanban-demo-evidence/tests.json 2>&1 | tee /tmp/kanban-demo-evidence/tests.log
          git diff --check
      - name: Commit tested follow-up
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = feat/markdown-kanban
          git fetch origin feat/markdown-kanban
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/App.test.tsx
          git commit -m 'fix: persist Kanban and ordinary demo edits in their in-memory file nodes'
          git push origin HEAD:feat/markdown-kanban
          git rev-parse HEAD > /tmp/kanban-demo-evidence/SOURCE_SHA.txt
          git diff HEAD^ HEAD > /tmp/kanban-demo-evidence/followup.patch
      - name: Install isolated browsers
        run: |
          npm install --prefix /tmp/localview-browser --ignore-scripts --save-exact playwright@1.58.2
          /tmp/localview-browser/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Verify all production browser interactions
        run: node scripts/verify-kanban-browser.mjs /tmp/localview-browser/package.json /tmp/kanban-demo-evidence/browser
      - name: Retain results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: kanban-demo-fix-evidence
          path: /tmp/kanban-demo-evidence/
          retention-days: 14
          if-no-files-found: error
