name: Build LocalView for macOS

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build LocalView
        run: npm run tauri:build

      - name: Verify macOS bundles
        run: |
          APP_PATH=(src-tauri/target/release/bundle/macos/*.app)
          DMG_PATH=(src-tauri/target/release/bundle/dmg/*.dmg)
          test -f "${APP_PATH[0]}/Contents/Resources/icon.icns"
          codesign --verify --deep --strict --verbose=4 "${APP_PATH[0]}"
          hdiutil verify "${DMG_PATH[0]}"

      - name: Upload macOS bundles
        uses: actions/upload-artifact@v4
        with:
          name: LocalView-macOS
          path: |
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
