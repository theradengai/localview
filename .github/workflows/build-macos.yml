name: Build LocalView for macOS

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            architecture: arm64
          - target: x86_64-apple-darwin
            architecture: x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.91.1
          targets: ${{ matrix.target }}

      - name: Build LocalView
        run: npm run tauri:build -- --target "${{ matrix.target }}" -- --locked

      - name: Verify macOS bundles
        env:
          BUNDLE_ROOT: src-tauri/target/${{ matrix.target }}/release/bundle
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          node scripts/verify-macos-bundle.mjs "$BUNDLE_ROOT/macos/LocalView.app" "$EXPECTED_ARCH"
          for image in "$BUNDLE_ROOT"/dmg/*.dmg; do
            hdiutil verify "$image"
          done
          cd "$BUNDLE_ROOT/dmg"
          shasum -a 256 ./*.dmg > SHA256SUMS.txt

      - name: Upload verified installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LocalView-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/
          if-no-files-found: error
          retention-days: 14
