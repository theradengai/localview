name: Check and build Windows
on:
  pull_request:
    paths: ['src/**', 'src-tauri/**', 'scripts/**', 'package*.json', '.gitattributes', '.github/workflows/windows.yml']
  push:
    branches: [main, staging]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version-file: .nvmrc, cache: npm}
      - run: npm ci
      - name: Check frontend
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/windows-evidence" | Out-Null
          git rev-parse HEAD | Set-Content "$env:RUNNER_TEMP/windows-evidence/SOURCE_SHA.txt"
          npm audit --audit-level=low 2>&1 | Tee-Object "$env:RUNNER_TEMP/windows-evidence/audit.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test 2>&1 | Tee-Object "$env:RUNNER_TEMP/windows-evidence/frontend.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build 2>&1 | Tee-Object "$env:RUNNER_TEMP/windows-evidence/build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with: {toolchain: 1.91.1, components: rustfmt}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-rust-1.91-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: windows-rust-1.91-${{ hashFiles('src-tauri/Cargo.lock') }}-
      - name: Compile and test native Windows operations
        shell: pwsh
        run: |
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --locked --manifest-path src-tauri/Cargo.toml 2>&1 | Tee-Object "$env:RUNNER_TEMP/windows-evidence/check.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml 2>&1 | Tee-Object "$env:RUNNER_TEMP/windows-evidence/tests.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml windows_recycle_bin_real_fixture -- --ignored --nocapture 2>&1 | Tee-Object "$env:RUNNER_TEMP/windows-evidence/recycle.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build release installer
        shell: pwsh
        run: |
          npm run tauri:build -- -- --locked 2>&1 | Tee-Object "$env:RUNNER_TEMP/windows-evidence/installer-build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Hash installer
        shell: pwsh
        run: |
          $files = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($files.Count -ne 1) { throw 'Expected exactly one installer' }
          $f = $files[0]
          $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($f.Name)" | Set-Content -Encoding utf8 "$($f.DirectoryName)/SHA256SUMS.txt"
          @{sourceCommit=(git rev-parse HEAD); sourceTree=(git rev-parse 'HEAD^{tree}'); architecture='x86_64'; version=(Get-Content package.json | ConvertFrom-Json).version; installer=$f.Name; sha256=$hash; signed=$false} | ConvertTo-Json | Set-Content -Encoding utf8 "$($f.DirectoryName)/BUILD-PROVENANCE.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: LocalView-Windows-x64
          path: src-tauri/target/release/bundle/nsis/
          retention-days: 14
          if-no-files-found: error
      - name: Verify actual installation and native WebView2 interface
        shell: pwsh
        timeout-minutes: 10
        run: |
          $installer = (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)[0].FullName
          ./scripts/verify-windows-install.ps1 -Installer $installer -Evidence "$env:RUNNER_TEMP/windows-evidence"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-rust-1.91-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.run_id }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: windows-native-evidence
          path: ${{ runner.temp }}/windows-evidence/
          retention-days: 14
