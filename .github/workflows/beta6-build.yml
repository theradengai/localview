name: Build fixed LocalView Beta 6
on:
  push:
    branches: [ci/beta6-build-tools]
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            architecture: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            architecture: x86_64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 4ae06b5678646f65b44ab1b6ecd66b36ceb82493
          persist-credentials: false
      - uses: actions/setup-node@249970cb... 
