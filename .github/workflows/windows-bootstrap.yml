name: Windows baseline and exact source workspace
on:
  push:
    branches: [work/windows-20260916]
    paths: [.github/workflows/windows-bootstrap.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 4ae06b5678646f65b44ab1b6ecd66b36ceb82493
          persist-credentials: false
      - run: git archive --format=tar.gz HEAD > /tmp/localview-beta6-source.tar.gz
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: exact-beta6-source
          path: /tmp/localview-beta6-source.tar.gz
          retention-days: 2
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 4ae06b5678646f65b44ab1b6ecd66b36ceb82493
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.91.1
          components: rustfmt
      - name: Baseline Windows compilation
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
